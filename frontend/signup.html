<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up Page - The Financial Ticket</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-container">

        <h1>Welcome To Your Financial Ticket</h1>
        <p>Create an account for new users!</p>

        <form id="signupForm" method="post">

            <label for="firstName">First Name</label>
            <input
                type="text"
                id="firstName"
                name="firstName"
                autocomplete="given-name"
                maxlength="50"
                placeholder="Enter your first name"
                required
            >
            <label for="lastName">Last Name </label>
            <input
                type="text"
                id="lastName"
                name="lastName"
                autocomplete="family-name"
                maxlength="50"
                placeholder="Enter your last name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
                placeholder="At least 8 characters"
                required
            >
            <button type="submit" id="signupButton">Sign Up!</button>
        </form>
        <p id="errorMessage" role="alert"></p>
        <p class="switch-auth">Already have an account? <a href="login.html">Log in</a></p>
        <a href="index.html">Back to Homepage</a>
    </div>

    <script src="signup.js"></script>
</body>
</html>
